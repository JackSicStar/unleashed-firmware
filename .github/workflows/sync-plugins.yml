name: Sync all-the-plugins → applications_user

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [sync-plugins]

permissions:
  contents: write

env:
  DEFAULT_TARGET_BRANCH: unl_dev_all_apps

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target branch
        id: resolve
        run: |
          # 1) repo_dispatch może podać branch
          if [ -n "${{ github.event.client_payload.branch }}" ]; then
            echo "branch=${{ github.event.client_payload.branch }}" >> $GITHUB_OUTPUT
          # 2) jeśli ręcznie z Actions – użyj aktualnej gałęzi workflowa
          elif [ "${{ github.ref_type }}" = "branch" ]; then
            echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "branch=${DEFAULT_TARGET_BRANCH}" >> $GITHUB_OUTPUT
          fi
          echo "Target branch -> ${{ steps.resolve.outputs.branch }}"

      - name: Checkout target (unleashed-firmware)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.branch }}
          fetch-depth: 0

      - name: Checkout source (all-the-plugins@dev)
        uses: actions/checkout@v4
        with:
          repository: JackSicStar/all-the-plugins
          ref: dev
          path: source_plugins
          fetch-depth: 0

      - name: Debug list of sources
        run: |
          echo "apps_source_code:" && ls -la source_plugins/apps_source_code || true
          echo "base_pack:" && ls -la source_plugins/base_pack || true
          echo "non_catalog_apps:" && ls -la source_plugins/non_catalog_apps || true

      - name: Prepare applications_user (remove ignore)
        run: |
          mkdir -p applications_user
          rm -f applications_user/.gitignore
          echo "applications_user before copy:" && ls -la applications_user || true

      - name: Copy apps
        run: |
          set -euo pipefail
          cp -R source_plugins/apps_source_code \
                source_plugins/base_pack \
                source_plugins/non_catalog_apps \
                applications_user/
          echo "applications_user after copy:" && ls -la applications_user || true

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-sync plugins → applications_user"
            git push origin ${{ steps.resolve.outputs.branch }}
          fi
