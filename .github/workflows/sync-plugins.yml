name: Sync all-the-plugins → applications_user

on:
  # ręcznie z Actions
  workflow_dispatch: {}
  # auto: nasłuch na event z drugiego repo
  repository_dispatch:
    types: [sync-plugins]
  # opcjonalnie: safety-net raz dziennie
  schedule:
    - cron: "15 4 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target (unleashed-firmware@dev)
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Checkout source (all-the-plugins@dev)
        uses: actions/checkout@v4
        with:
          repository: JackSicStar/all-the-plugins
          ref: dev
          path: source_plugins

      - name: Copy apps into applications_user
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p applications_user
          shopt -s dotglob nullglob
          for d in \
            source_plugins/apps_source_code/* \
            source_plugins/base_pack/* \
            source_plugins/non_catalog_apps/*; do
            [ -e "$d" ] || continue
            cp -R "$d" applications_user/
          done

      - name: Commit if changed
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "Auto-sync from all-the-plugins → applications_user"
          else
            echo "No changes."
          fi

      - name: Push
        run: git push origin dev
