name: Sync ALL plugins -> applications_user (flat)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Cel: TA GAŁĄŹ (unl_dev_all_apps)
      - name: Checkout target (unleashed-firmware@unl_dev_all_apps)
        uses: actions/checkout@v4
        with:
          ref: unl_dev_all_apps
          fetch-depth: 0

      # Źródło: all-the-plugins@dev do podkatalogu source_plugins
      - name: Checkout source (all-the-plugins@dev)
        uses: actions/checkout@v4
        with:
          repository: JackSicStar/all-the-plugins
          ref: dev
          path: source_plugins
          fetch-depth: 0

      # Debug: pokaż co realnie mamy w źródłach
      - name: Debug source trees
        run: |
          echo "=== apps_source_code ==="; ls -laR source_plugins/apps_source_code || true
          echo "=== base_pack ===";       ls -laR source_plugins/base_pack || true
          echo "=== non_catalog_apps ===";ls -laR source_plugins/non_catalog_apps || true

      # Przygotuj cel: usuń starego killera
      - name: Prepare target
        run: |
          mkdir -p applications_user
          rm -f applications_user/.gitignore
          echo "=== TARGET before copy ==="; ls -la applications_user || true

      # KOPIOWANIE NA PŁASKO do applications_user/
      - name: Copy flat into applications_user
        run: |
          set -euo pipefail
          shopt -s dotglob nullglob
          cp -a source_plugins/apps_source_code/*  applications_user/ 2>/dev/null || true
          cp -a source_plugins/base_pack/*         applications_user/ 2>/dev/null || true
          cp -a source_plugins/non_catalog_apps/*  applications_user/ 2>/dev/null || true
          echo "=== TARGET after copy ==="; ls -la applications_user || true

      # Znacznik, by commit był widoczny nawet gdy źródło puste
      - name: Write sync stamp
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > applications_user/.syncstamp

      # Commit & push
      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync plugins (flat) from all-the-plugins → applications_user"
            git push origin unl_dev_all_apps
          fi
