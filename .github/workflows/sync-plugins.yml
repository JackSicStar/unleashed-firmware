name: Sync all-the-plugins → applications_user

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [sync-plugins]

permissions:
  contents: write

env:
  # Domyślna gałąź docelowa (zmienisz eventem repo_dispatch)
  TARGET_BRANCH: unl_dev_all_apps

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target branch from dispatch payload
        id: resolve
        run: |
          # jeśli przyszło z repository_dispatch, weź branch z payloadu
          if [ -n "${{ github.event.client_payload.branch }}" ]; then
            echo "branch=${{ github.event.client_payload.branch }}" >> $GITHUB_OUTPUT
          else
            echo "branch=${TARGET_BRANCH}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout target (unleashed-firmware@${{ steps.resolve.outputs.branch }})
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.branch }}
          fetch-depth: 0

      - name: Checkout source (all-the-plugins@dev)
        uses: actions/checkout@v4
        with:
          repository: JackSicStar/all-the-plugins
          ref: dev
          path: source_plugins
          fetch-depth: 0

      - name: Prepare applications_user
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p applications_user
          # KILLER: usuń .gitignore, który blokuje śledzenie plików
          rm -f applications_user/.gitignore

      - name: Copy apps into applications_user
        shell: bash
        run: |
          set -euo pipefail
          shopt -s dotglob nullglob
          # jeśli chcesz mieć w środku trzy podkatalogi, użyj CP poniżej:
          cp -R source_plugins/apps_source_code \
                source_plugins/base_pack \
                source_plugins/non_catalog_apps \
                applications_user/
          echo "After copy tree:"
          ls -la applications_user || true

      - name: Commit if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "Auto-sync: apps_source_code, base_pack, non_catalog_apps → applications_user"
          else
            echo "No changes to commit."
          fi

      - name: Push
        run: |
          git push origin ${{ steps.resolve.outputs.branch }}
