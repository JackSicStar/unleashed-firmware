name: Sync all-the-plugins → applications_user

on:
  workflow_dispatch: {}          # ręczne uruchamianie z zakładki Actions
  schedule:
    - cron: "15 4 * * *"        # (opcjonalnie) codziennie 04:15 UTC

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 1) Checkout celu (Twoje unleashed-firmware/dev)
      - name: Checkout target repo (unleashed-firmware)
        uses: actions/checkout@v4
        with:
          ref: dev

      # 2) Checkout źródła (all-the-plugins/dev) do podkatalogu source_plugins
      - name: Checkout source repo (all-the-plugins)
        uses: actions/checkout@v4
        with:
          repository: JackSicStar/all-the-plugins
          ref: dev
          path: source_plugins

      # 3) Skopiuj ZAWARTOŚĆ trzech folderów do applications_user
      #    Kopiujemy dzieci (podfoldery/apki), nie sam katalog-ramkę
      - name: Copy plugins into applications_user
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p applications_user
          shopt -s dotglob nullglob
          for d in \
            source_plugins/apps_source_code/* \
            source_plugins/base_pack/* \
            source_plugins/non_catalog_apps/*; do
            # jeżeli pusty glob – pomiń
            [ -e "$d" ] || continue
            cp -R "$d" applications_user/
          done

      # 4) Commit tylko gdy są zmiany
      - name: Commit changes if any
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "Sync plugins from all-the-plugins (apps_source_code, base_pack, non_catalog_apps) → applications_user"
          else
            echo "No changes to commit."
          fi

      # 5) Push na dev
      - name: Push
        if: success()
        run: |
          git push origin dev
