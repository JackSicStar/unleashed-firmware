name: "CodeQL"
run-name: "CodeQL Analyze ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["dev"]
  workflow_dispatch: {}

jobs:
  analyze:
    name: Analyze (cpp)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    env:
      PATH_SARIF_DIR: ".github/results.sarif"
      PATH_SARIF_FILE: ".github/results.sarif/cpp.sarif"
      FBT_NO_SYNC: 0
      DIST_SUFFIX: "codeql"
      WORKFLOW_BRANCH_OR_TAG: release-cfw
      LANG_CATEGORY: "/language:cpp"

    steps:
      # 1) Checkout BEZ auto-submodule (żeby nie wybuchło na 'source_plugins')
      - name: Checkout Firmware Files
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
          submodules: false   # <— kluczowe, sami zainicjalizujemy niżej

      # 2) Jeśli kiedyś przypadkiem dodało się 'source_plugins' jako submodule,
      #    usuń jego wpis i gitlink zanim spróbujemy inicjalizować submoduły.
      - name: Clean stray submodule entry (source_plugins)
        run: |
          set -e
          if [ -f .gitmodules ]; then
            if git config -f .gitmodules --get-regexp '^submodule\.source_plugins\.' >/dev/null 2>&1; then
              echo "Removing ghost submodule 'source_plugins'…"
              git rm -f --cached source_plugins 2>/dev/null || true
              git config -f .gitmodules --remove-section submodule.source_plugins || true
              # usuń pusty .gitmodules, jeśli już nie ma sekcji
              if ! git config -f .gitmodules -l >/dev/null 2>&1; then
                rm -f .gitmodules
              fi
            fi
          fi

      # 3) Submodules init dopiero teraz – po czyszczeniu
      - name: Init real submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      # 4) CodeQL init
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: cpp
          setup-python-dependencies: true

      # 5) Resolve CodeQL Build Env (standard)
      - name: Resolve CodeQL Build Env
        uses: github/codeql-action/resolve-environment@v2
        with:
          language: cpp

      # 6) Build firmware (jak miałeś)
      - name: Build Firmware
        if: ${{ success() }}
        shell: bash
        run: |
          ./fbt COMPACT=1 DEBUG=0 FBT_NO_SYNC=${{ env.FBT_NO_SYNC }}

      # 7) CodeQL analyze
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        if: ${{ success() }}
        with:
          threads: 4
          category: "${{ env.LANG_CATEGORY }}"
          output: "${{ env.PATH_SARIF_DIR }}"
          upload-database: false
          upload: "failure-only"

      # 8) Odfiltruj foldery w SARIF
      - name: Filter dirs for SARIF
        uses: advanced-security/filter-sarif@v1
        if: ${{ success() }}
        with:
          patterns: |
            -build/**
            -dist/**
            -toolchain/**
            -lib/**
          input: "${{ env.PATH_SARIF_FILE }}"
          output: "${{ env.PATH_SARIF_FILE }}"

      # 9) Wyślij SARIF
      - name: Upload CodeQL SARIF
        uses: github/codeql-action/upload-sarif@v2
        if: ${{ success() }}
        with:
          category: "${{ env.LANG_CATEGORY }}"
          sarif_file: "${{ env.PATH_SARIF_FILE }}"
